          content:
            application/json:
              schema:
                type: object
                properties:
                  estatisticas:
                    type: object
                    properties:
                      total_usuarios:
                        type: integer
                      total_livros:
                        type: integer
                      total_leituras:
                        type: integer
                      total_paginas_lidas:
                        type: integer
                      livros_lidos:
                        type: integer
