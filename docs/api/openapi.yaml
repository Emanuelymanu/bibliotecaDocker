openapi: 3.0.3
info:
  title: Gerenciamento de Leituras (Estante Digital) – API
  version: 1.3.0
  description: 'Endpoints do sistema publicados pelo Nginx: Backend Principal (Express) e Conquistas Service (NestJS).


    Observações:

    - Todas as rotas passam pelo Nginx (HTTPS) e, exceto as marcadas como públicas, exigem o token JWT no cabeçalho
    `Authorization: Bearer <token>`.

    - Rotas de administração exigem perfil de administrador, verificado no banco a cada requisição.

    - Os formatos de resposta descrevem os campos principais; campos adicionais podem existir.

    - Os códigos de erro listados em cada operação são os principais retornados pelo código.

    - As rotas /api/conquistas são encaminhadas pelo Nginx ao Conquistas Service (NestJS). As demais rotas /api/
    são encaminhadas ao Backend Principal (Express).

    - Toda resposta traz o cabeçalho `X-Request-Id`, o mesmo id que aparece nos logs da requisição.

    - Se o Conquistas Service estiver fora do ar, o Nginx responde 503 JSON nas rotas /api/conquistas; as demais
    rotas continuam funcionando.

    - Erros: no Conquistas Service e nos erros tratados pelo middleware central do Express (GDL-35) a resposta é `{ "erro": "...", "statusCode": 400 }`; alguns controllers antigos do Express ainda respondem só `{ "erro": "..." }`. Rotas /api inexistentes respondem 404 em JSON.'
servers:
- url: https://estantedigital.local
  description: Nginx em ambiente local (Docker Compose); domínio configurado no nginx.conf
tags:
- name: Autenticação
  description: Cadastro e login. Rotas públicas.
- name: Perfil
  description: Dados do usuário autenticado.
- name: Livros
  description: Catálogo de livros, busca, filtros e capas. Algumas rotas de consulta são públicas.
- name: Leituras
  description: 'Leitura de cada usuário: status, progresso e avaliação.'
- name: Sessões de leitura
  description: Sessões de leitura de cada leitura.
- name: Anotações
  description: Anotações de cada leitura.
- name: Metas de leitura
  description: Meta anual de livros e páginas.
- name: Lista de desejos
  description: Livros que o usuário deseja ler.
- name: Dashboard
  description: Estatísticas do usuário.
- name: Conquistas
  description: Conquistas do usuário. Atendidas pelo Conquistas Service (NestJS).
- name: Administração
  description: 'Operações restritas a administradores: catálogo, usuários e conquistas.'
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - Infraestrutura
      summary: Liveness do Nginx
      security: []
      description: 'Respondido pelo próprio Nginx (texto `healthy`), sem consultar os serviços: indica só que o
        proxy está no ar. A saúde do MySQL, do Redis e do Conquistas Service é verificada pelos healthchecks do
        Docker Compose (`docker compose ps`).'
      responses:
        '200':
          description: Nginx ativo
          content:
            text/plain:
              schema:
                type: string
                example: healthy
  /api/auth/login:
    post:
      tags:
      - Autenticação
      summary: Autentica o usuário e devolve o token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
              required:
              - email
              - senha
      responses:
        '200':
          description: Login bem-sucedido. O token tem validade de 5 horas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/UsuarioResumo'
        '400':
          description: Email e senha são obrigatórios ou o formato do email é inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '401':
          description: Email ou senha inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/auth/cadastro:
    post:
      tags:
      - Autenticação
      summary: Cadastra um novo usuário
      description: Exige CPF válido, e-mail válido e senha conforme a regra do campo `senha`. E-mail ou CPF já cadastrados
        também respondem 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                email:
                  type: string
                  format: email
                cpf:
                  type: string
                  description: CPF válido (com ou sem máscara).
                senha:
                  type: string
                  description: A senha deve ter no mínimo 6 caracteres, contendo apenas letras e números, com ao
                    menos uma letra e um número.
              required:
              - nome
              - email
              - cpf
              - senha
      responses:
        '201':
          description: Usuário cadastrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/UsuarioResumo'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/auth/perfil:
    get:
      tags:
      - Perfil
      summary: Consulta o perfil do usuário autenticado (mesmo perfil, pela rota de autenticação)
      description: 'A mesma operação existe em /api/auth/perfil.


        Mesma implementação de `GET /api/perfil`.'
      responses:
        '200':
          description: Dados do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags:
      - Perfil
      summary: Edita o perfil do usuário autenticado (mesmo perfil, pela rota de autenticação)
      description: 'A mesma operação existe em /api/auth/perfil.


        Mesma implementação de `PUT /api/perfil`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                cpf:
                  type: string
                senha:
                  type: string
              description: Todos os campos são opcionais.
      responses:
        '200':
          description: Perfil atualizado.
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/perfil:
    get:
      tags:
      - Perfil
      summary: Consulta o perfil do usuário autenticado
      description: A mesma operação existe em /api/auth/perfil.
      responses:
        '200':
          description: Dados do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags:
      - Perfil
      summary: Edita o perfil do usuário autenticado
      description: A mesma operação existe em /api/auth/perfil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                cpf:
                  type: string
                senha:
                  type: string
              description: Todos os campos são opcionais.
      responses:
        '200':
          description: Perfil atualizado.
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/livros:
    get:
      tags:
      - Livros
      summary: Lista os livros do acervo, com filtros e paginação (rota alternativa)
      description: 'A mesma operação existe em GET /api/livros.


        Mesma implementação de `GET /api/livros/listar`.'
      parameters:
      - name: page
        in: query
        required: false
        description: Número da página (padrão 1).
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        required: false
        description: Itens por página (padrão 100).
        schema:
          type: integer
          default: 100
          minimum: 1
      - name: busca
        in: query
        required: false
        description: Texto de busca.
        schema:
          type: string
      - name: genero
        in: query
        required: false
        description: Nome do gênero.
        schema:
          type: string
      - name: editora
        in: query
        required: false
        description: Nome da editora.
        schema:
          type: string
      - name: autor
        in: query
        required: false
        description: Nome do autor.
        schema:
          type: string
      - name: tipo_obra
        in: query
        required: false
        description: Tipo da obra.
        schema:
          type: string
          enum:
          - unico
          - trilogia
          - serie
          - colecao
      - name: avaliacao_min
        in: query
        required: false
        description: Avaliação média mínima.
        schema:
          type: number
      - name: avaliacao_max
        in: query
        required: false
        description: Avaliação média máxima.
        schema:
          type: number
      - name: ordenar_por
        in: query
        required: false
        description: Campo de ordenação (padrão titulo).
        schema:
          type: string
      - name: ordem
        in: query
        required: false
        description: ASC (padrão) ou DESC.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Lista paginada de livros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Paginacao'
                - type: object
                  properties:
                    limite:
                      type: integer
                    filtros_aplicados:
                      type: object
                      properties:
                        busca:
                          type: string
                        genero:
                          type: string
                        editora:
                          type: string
                        autor:
                          type: string
                        tipo_obra:
                          type: string
                        avaliacao:
                          type: string
                          description: Intervalo no formato "min - max".
                    ordenacao:
                      type: object
                      properties:
                        campo:
                          type: string
                        direcao:
                          type: string
                    livros:
                      type: array
                      items:
                        $ref: '#/components/schemas/Livro'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/livros/listar:
    get:
      tags:
      - Livros
      summary: Lista os livros do acervo, com filtros e paginação
      description: A mesma operação existe em GET /api/livros.
      parameters:
      - name: page
        in: query
        required: false
        description: Número da página (padrão 1).
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        required: false
        description: Itens por página (padrão 100).
        schema:
          type: integer
          default: 100
          minimum: 1
      - name: busca
        in: query
        required: false
        description: Texto de busca.
        schema:
          type: string
      - name: genero
        in: query
        required: false
        description: Nome do gênero.
        schema:
          type: string
      - name: editora
        in: query
        required: false
        description: Nome da editora.
        schema:
          type: string
      - name: autor
        in: query
        required: false
        description: Nome do autor.
        schema:
          type: string
      - name: tipo_obra
        in: query
        required: false
        description: Tipo da obra.
        schema:
          type: string
          enum:
          - unico
          - trilogia
          - serie
          - colecao
      - name: avaliacao_min
        in: query
        required: false
        description: Avaliação média mínima.
        schema:
          type: number
      - name: avaliacao_max
        in: query
        required: false
        description: Avaliação média máxima.
        schema:
          type: number
      - name: ordenar_por
        in: query
        required: false
        description: Campo de ordenação (padrão titulo).
        schema:
          type: string
      - name: ordem
        in: query
        required: false
        description: ASC (padrão) ou DESC.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Lista paginada de livros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Paginacao'
                - type: object
                  properties:
                    limite:
                      type: integer
                    filtros_aplicados:
                      type: object
                      properties:
                        busca:
                          type: string
                        genero:
                          type: string
                        editora:
                          type: string
                        autor:
                          type: string
                        tipo_obra:
                          type: string
                        avaliacao:
                          type: string
                          description: Intervalo no formato "min - max".
                    ordenacao:
                      type: object
                      properties:
                        campo:
                          type: string
                        direcao:
                          type: string
                    livros:
                      type: array
                      items:
                        $ref: '#/components/schemas/Livro'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/livros/top-avaliados:
    get:
      tags:
      - Livros
      summary: Lista os livros mais bem avaliados
      responses:
        '200':
          description: Ranking de livros.
          content:
            application/json:
              schema:
                type: object
                properties:
                  livros:
                    type: array
                    items:
                      $ref: '#/components/schemas/Livro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/livros/filtros/opcoes:
    get:
      tags:
      - Livros
      summary: Obtém as opções disponíveis para os filtros
      security: []
      responses:
        '200':
          description: Opções de filtro.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generos:
                    type: array
                    items:
                      type: string
                  editoras:
                    type: array
                    items:
                      type: string
                  autores:
                    type: array
                    items:
                      type: string
                  tipos_obra:
                    type: array
                    items:
                      type: string
                  avaliacoes:
                    type: object
                    properties:
                      min:
                        type: number
                      max:
                        type: number
                      step:
                        type: number
                  ordenacao:
                    type: object
                    properties:
                      campos:
                        type: array
                        items:
                          type: string
                      direcoes:
                        type: array
                        items:
                          type: string
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/livros/genero/{genero}:
    get:
      tags:
      - Livros
      summary: Lista livros por gênero
      description: Combina livros do MySQL com resultados da Google Books API; se a API externa falhar, a rota segue
        com os resultados locais.
      security: []
      parameters:
      - name: genero
        in: path
        required: true
        description: Nome do gênero.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Número da página (padrão 1).
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        required: false
        description: Itens por página (padrão 10).
        schema:
          type: integer
          default: 10
          minimum: 1
      responses:
        '200':
          description: Lista paginada de livros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Paginacao'
                - type: object
                  properties:
                    livros:
                      type: array
                      items:
                        $ref: '#/components/schemas/Livro'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/livros/autor/{autor}:
    get:
      tags:
      - Livros
      summary: Lista livros por autor
      description: Combina livros do MySQL com resultados da Google Books API; se a API externa falhar, a rota segue
        com os resultados locais.
      security: []
      parameters:
      - name: autor
        in: path
        required: true
        description: Nome do autor.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Número da página (padrão 1).
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        required: false
        description: Itens por página (padrão 10).
        schema:
          type: integer
          default: 10
          minimum: 1
      responses:
        '200':
          description: Lista paginada de livros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Paginacao'
                - type: object
                  properties:
                    livros:
                      type: array
                      items:
