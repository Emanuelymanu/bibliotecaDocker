          $ref: '#/components/responses/NaoAutenticado'
        '500':
          $ref: '#/components/responses/ErroInterno'
      description: Cache-aside no Redis por leitor (`dashboard:usuario:<id>`), TTL `CACHE_DASHBOARD_TTL` (padrão
        300 s). Invalidado por qualquer escrita 2xx do leitor. Com Redis fora, responde direto do banco.
