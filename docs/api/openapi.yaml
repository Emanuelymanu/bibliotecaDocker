                  usuarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsuarioAdmin'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/admin/usuarios/{id}/promover:
    put:
      tags:
      - Administração
      summary: Promove um usuário a administrador
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do usuário.
        schema:
          type: integer
      description: 'Exige perfil de administrador.


        Publica `usuario.permissao_alterada`; o Conquistas Service passa a recusar (401) os tokens desse usuário
        emitidos antes da mudança. O usuário precisa fazer login de novo.'
      responses:
        '200':
          description: Usuário promovido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/UsuarioAdmin'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/admin/usuarios/{id}/rebaixar:
    put:
      tags:
      - Administração
      summary: Rebaixa um administrador a usuário comum
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do usuário.
        schema:
          type: integer
      description: 'Exige perfil de administrador.


        Publica `usuario.permissao_alterada`; o Conquistas Service passa a recusar (401) os tokens desse usuário
        emitidos antes da mudança. O usuário precisa fazer login de novo.'
      responses:
        '200':
          description: Usuário rebaixado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/UsuarioAdmin'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
        statusCode:
          type: integer
          description: Código HTTP repetido no corpo (Express, Conquistas Service e Nginx).
        detalhes:
          type: array
          items:
            type: string
          description: Campos inválidos, em erros de validação do banco.
      required:
      - erro
    UsuarioResumo:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        tipo_usuario:
          type: string
          enum:
          - usuario
          - admin
      description: Resumo do usuário. Podem existir campos adicionais.
    Livro:
      type: object
      properties:
        id_livro:
          type: integer
        id_google:
          type: string
        titulo:
          type: string
        subtitulo:
          type: string
        tipo_obra:
          type: string
          enum:
          - unico
          - trilogia
          - serie
          - colecao
        ano_publicacao:
          type: integer
        num_paginas:
          type: integer
        capa:
          type: string
        editora:
          type: string
        autores:
          type: array
          items:
            type: string
        generos:
          type: array
          items:
            type: string
        avaliacao_media:
          type: number
      description: Formato resumido; os campos exatos variam conforme a rota.
    Leitura:
      type: object
      properties:
        id_leitura:
          type: integer
        id_livro:
          type: integer
        status:
          type: string
          enum:
          - nao_lido
          - quero_ler
          - lendo
          - lido
          - abandonado
          - relendo
        data_inicio:
          type: string
          format: date
        data_conclusao:
          type: string
          format: date
        avaliacao:
          type: number
          minimum: 0
          maximum: 5
        resenha:
          type: string
        pagina_atual:
          type: integer
        vezes_lido:
          type: integer
        livro:
          $ref: '#/components/schemas/Livro'
    SessaoLeitura:
      type: object
      properties:
        id_sessao:
          type: integer
        id_leitura:
          type: integer
        data:
          type: string
          format: date
        pagina_inicial:
          type: integer
        pagina_final:
          type: integer
        duracao_minutos:
          type: integer
    Anotacao:
      type: object
      properties:
        id_anotacao:
          type: integer
        id_leitura:
          type: integer
        pagina:
          type: integer
        titulo:
          type: string
        conteudo:
          type: string
    MetaLeitura:
      type: object
      properties:
        id_meta:
          type: integer
        ano:
          type: integer
        qtd_livros_alvo:
          type: integer
        qtd_paginas_alvo:
          type: integer
    Conquista:
      type: object
      properties:
        id_conquista:
          type: integer
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        icone:
          type: string
          nullable: true
        criterio:
          type: string
          nullable: true
          description: Texto de exibição gerado a partir do critério estruturado.
        tipo:
          $ref: '#/components/schemas/TipoConquista'
        valor_alvo:
          type: integer
          minimum: 1
        id_genero:
          type: integer
          nullable: true
          description: Só para LIVROS_GENERO.
        nome_genero:
          type: string
          nullable: true
          description: Nome do gênero guardado na conquista (sem FK entre schemas).
    ConquistaDoCatalogo:
      type: object
      properties:
        id_conquista:
          type: integer
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        criterio:
          type: string
          nullable: true
        icone:
          type: string
          nullable: true
        tipo:
          $ref: '#/components/schemas/TipoConquista'
        valor_alvo:
          type: integer
        progresso:
          type: integer
          nullable: true
          description: Quanto o leitor já tem do valor-alvo; null para MANUAL.
        desbloqueada:
          type: boolean
        data_conquista:
          type: string
          format: date
          nullable: true
    Paginacao:
      type: object
      properties:
        total:
          type: integer
        pagina:
          type: integer
        totalPaginas:
          type: integer
    ProgressoMeta:
      type: object
      properties:
        livros_lidos:
          type: integer
        paginas_lidas:
          type: integer
      description: Livros e páginas lidos no ano da meta.
    UsuarioAdmin:
      type: object
      properties:
        id_usuario:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        tipo_usuario:
          type: string
          enum:
          - usuario
          - admin
    SessaoComLeitura:
      allOf:
      - $ref: '#/components/schemas/SessaoLeitura'
      - type: object
        properties:
          leitura:
            type: object
            properties:
              id_leitura:
                type: integer
              id_livro:
                type: integer
              status:
                type: string
              pagina_atual:
                type: integer
    TipoConquista:
      type: string
      enum:
      - MANUAL
      - LIVROS_LIDOS
      - LIVROS_CADASTRADOS
      - PAGINAS_LIDAS
      - SESSOES
      - ANOTACOES
      - AVALIACOES
      - GENEROS_DISTINTOS
      - LIVROS_GENERO
      - POSSUI_META
    ConquistaNova:
      type: object
      properties:
        id_conquista:
          type: integer
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        icone:
          type: string
          nullable: true
        data_conquista:
          type: string
          format: date
          nullable: true
  responses:
    RequisicaoInvalida:
      description: Dados inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    SemPermissao:
      description: O usuário não tem perfil de administrador.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroInterno:
      description: Erro interno do servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ServicoIndisponivel:
      description: Conquistas Service fora do ar (resposta do Nginx) ou, em rotas de admin, Redis indisponível para
        checar a revogação do token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  headers:
    XCache:
      description: 'Origem da resposta: HIT (Redis), MISS (banco, guardado no cache) ou SEM_CACHE (Redis indisponível;
        só no catálogo de conquistas).'
      schema:
        type: string
        enum:
        - HIT
        - MISS
        - SEM_CACHE