        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
      description: Depois de uma resposta 2xx, o backend publica o evento `estatisticas.atualizadas` (Redis Pub/Sub)
        para o Conquistas Service e invalida o cache da dashboard do leitor. Conquistas novas são consultadas em
        `GET /api/conquistas/novas`.
