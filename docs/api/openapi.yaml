          $ref: '#/components/responses/RequisicaoInvalida'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/livros/editora/{editora}:
    get:
      tags:
      - Livros
      summary: Lista livros por editora
      description: Combina livros do MySQL com resultados da Google Books API; se a API externa falhar, a rota segue
        com os resultados locais.
      security: []
      parameters:
      - name: editora
        in: path
        required: true
        description: Nome do editora.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Número da página (padrão 1).
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        required: false
        description: Itens por página (padrão 10).
        schema:
          type: integer
          default: 10
          minimum: 1
      responses:
        '200':
          description: Lista paginada de livros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Paginacao'
                - type: object
                  properties:
                    livros:
                      type: array
                      items:
                        $ref: '#/components/schemas/Livro'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/livros/status/leitura:
    get:
      tags:
      - Livros
      summary: Lista os livros do usuário filtrados pelo status de leitura
      parameters:
      - name: status
        in: query
        required: false
        description: Status de leitura.
        schema:
          type: string
          enum:
          - nao_lido
          - quero_ler
          - lendo
          - lido
          - abandonado
          - relendo
      - name: page
        in: query
        required: false
        description: Número da página (padrão 1).
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        required: false
        description: Itens por página (padrão 10).
        schema:
          type: integer
          default: 10
          minimum: 1
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Paginacao'
                - type: object
                  properties:
                    status_filtrado:
                      type: string
                    livros:
                      type: array
                      items:
                        $ref: '#/components/schemas/Livro'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/livros/buscar:
    get:
      tags:
      - Livros
      summary: Busca livros diretamente na Google Books API
      description: Busca na Google Books API com timeout (`GOOGLE_BOOKS_TIMEOUT_MS`, padrão 4 s), uma nova tentativa
        em falha temporária e circuit breaker (3 falhas seguidas → 30 s sem chamar o Google). Se o Google não responder,
        devolve 503 com mensagem amigável.
      security: []
      parameters:
      - name: query
        in: query
        required: true
        description: Texto da busca.
        schema:
          type: string
      responses:
        '200':
          description: Resultados no formato do Google Books (volumeInfo).
          content:
            application/json:
              schema:
                type: object
                properties:
                  livros:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: Item no formato da Google Books API (campo volumeInfo); só o endereço das imagens
                        é normalizado para HTTPS.
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '429':
          description: Limite de uso da Google Books API atingido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: Google Books indisponível (timeout, erro ou circuito aberto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: A busca no Google Books está indisponível no momento. Tente novamente em alguns instantes.
  /api/livros/cadastrar:
    post:
      tags:
      - Livros
      summary: Cadastra um livro e o vincula à estante do usuário
      description: 'A mesma operação existe em POST /api/livros/cadastrar-com-google. O título e ao menos um autor
        (campo `autor` ou `autores`) são obrigatórios. Se o livro já estiver na estante do usuário, responde 409.


        Depois de uma resposta 2xx, o backend publica o evento `estatisticas.atualizadas` (Redis Pub/Sub) para o
        Conquistas Service e invalida o cache da dashboard do leitor. Conquistas novas são consultadas em `GET /api/conquistas/novas`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                id_google:
                  type: string
                autor:
                  type: string
                autores:
                  type: string
                  description: Lista de autores.
                subtitulo:
                  type: string
                tipo_obra:
                  type: string
                  enum:
                  - unico
                  - trilogia
                  - serie
                  - colecao
                ano_publicacao:
                  type: integer
                num_paginas:
                  type: integer
                editora:
                  type: string
                generos:
                  type: string
                  description: Lista de gêneros.
                capa:
                  type: string
                  format: binary
                  description: Imagem da capa (até 5 MB).
              required:
              - titulo
      responses:
        '201':
          description: Livro cadastrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
