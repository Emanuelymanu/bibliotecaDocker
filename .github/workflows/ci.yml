name: CI/CD

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Express) - build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-Projeto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend-Projeto/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  conquistas-service:
    name: conquistas-service (NestJS) - build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conquistas-service
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: projeto5p
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: gamificacao
      DB_USER: gamificacao
      DB_PASSWORD: gamificacao_ci
      JWT_SECRET: segredo_somente_para_o_ci
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conquistas-service/package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Criar banco gamificacao (banco/init/01-gamificacao.sh)
        working-directory: .
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_TCP_PORT: 3306
          MYSQL_ROOT_PASSWORD: root_ci
          GAMIFICACAO_DB_USER: gamificacao
          GAMIFICACAO_DB_PASSWORD: gamificacao_ci
        run: bash banco/init/01-gamificacao.sh | tee /tmp/init.log && grep -q 'pronto' /tmp/init.log
      - name: Testes unitários
        run: npm test
      - name: Testes e2e
        run: npm run test:e2e
      - name: Testes de integração (MySQL e Redis reais)
        run: npm run test:banco

  frontend:
    name: Frontend (React) - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend-Projeto/ProjetoFrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend-Projeto/ProjetoFrontend/package-lock.json
      - run: npm ci

      - run: npx vite build

  imagens:
    name: Imagens Docker (docker compose build)
    runs-on: ubuntu-latest
    needs: [backend, conquistas-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Gerar .env de CI
        run: cp .env.example .env
      - name: Validar docker-compose.yaml
        run: docker compose config --quiet
      - name: Build das imagens
        run: docker compose build

  deploy:
    name: Deploy - publicar imagens da versão
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [imagens]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servico:
          - { nome: backend, contexto: Backend-Projeto }
          - { nome: conquistas-service, contexto: conquistas-service }
          - { nome: frontend, contexto: Frontend-Projeto/ProjetoFrontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem em minúsculas
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/estante-${{ matrix.servico.nome }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.servico.contexto }}
          push: true
          tags: |
            ${{ steps.nome.outputs.imagem }}:${{ github.ref_name }}
            ${{ steps.nome.outputs.imagem }}:latest